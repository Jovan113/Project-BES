<!doctype html>
<html>
  <head>
    <title>My Login System</title>
    <link rel="stylesheet" href="Ptcss.css">
    <script src="PTJS.js" defer></script>
  </head>
  <body class="bgcolor">
    <form class="logindes">
      <h1 class="text-center text-white pt-5">Forgot Password:</h1>

      <div class="Field">
        <input type="email" id="Email" name="Email" placeholder=" " required>
        <label for="Email">Email</label>
      </div>

      <button type="button" onclick="ForgotPassword()" class="formbuttons">Reset Password</button>
      <button type="button" onclick="BackLogIn()" class="formbuttons">Log In</button>
    </form>
  </body> 
</html>
