<!doctype html>
<html>
  <head>
    <title>My Login System</title>
    <link rel="stylesheet" href="Ptcss.css">
    <script src="PTJS.js" defer></script>
  </head>
  <body class="bgcolor">
    <form class="logindes">
    <h1 class="text-center text-white pt-5">Register:</h1>
      <label for="Username">Username:</label>
      <input type="text" id="Username" name="Username"><br><br>
      <label for="Password">Password:</label>
      <input type="password" id="Password" name="Password"><br><br>
      <label for="Email">Email:</label>
      <input type="email" id="Email" name="Email"><br><br>
      <button type="button" onclick="Register()" class="formbuttons">Register</button>
      <button type="button" onclick="BackLogIn()" class="formbuttons">Log In</button>
    </form>
  </body> 
</html>
